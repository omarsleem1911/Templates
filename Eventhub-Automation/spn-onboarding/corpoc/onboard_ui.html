<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Onboard Azure</title>
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#1d2433;--muted:#5f6b7c;--faint:#8a95a5;--line:#e3e8ef;--line2:#d4dbe5;
--navy:#1f2d4a;--blue:#1a5fd8;--blue2:#0078d4;--bluebg:#e8f0fe;--green:#1f9d55;--greenbg:#e5f6ec;--red:#d93838;--redbg:#fdecec;
--amber:#c77800;--amberbg:#fff4e0;--purple:#7a3fd1;--purplebg:#efe7fb;--head:#f5f7fa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
.page{max-width:1240px;margin:0 auto;padding:28px 24px 48px}
.card{background:var(--card);border:1px solid var(--line2);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(20,30,50,.06)}
.banner{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 18px;font-size:20px;font-weight:700;letter-spacing:-.2px}
.banner .num{width:32px;height:32px;border-radius:50%;background:#2f6fe4;display:grid;place-items:center;font-size:17px;flex:none}
.inner{padding:20px 32px 28px}
.apphead{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px}
.apphead .sess{margin-left:auto;font-weight:500;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block}.dot.on{background:var(--green)}
.stepper{display:grid;grid-template-columns:repeat(5,1fr);margin:16px 0 20px}
.st{position:relative;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--ink);text-align:center}
.st:not(:first-child)::before{content:"";position:absolute;top:8px;right:calc(50% + 11px);width:calc(100% - 22px);height:2px;background:var(--line2)}
.st.done::before,.st.cur::before{background:var(--green)}
.st .c{width:18px;height:18px;border-radius:50%;border:2px solid #9aa5b4;background:#fff;display:grid;place-items:center;margin-bottom:5px;z-index:1}
.st.done .c{background:var(--green);border-color:var(--green)}
.st.cur .c{border:3px solid var(--blue)}.st.cur .c::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--blue)}
.st.cur span{font-weight:700;color:var(--blue)}
.center{text-align:center}
h2{font-size:21px;margin:6px 0 4px;letter-spacing:-.2px}
h3{font-size:15px;margin:18px 0 8px}
.sub{color:var(--muted);margin:0 0 16px}
.perm{display:inline-block;text-align:left;background:#f4f8fd;border:1px solid #dde7f4;border-radius:8px;padding:12px 18px;margin:6px 0 18px}
.perm .ph{display:flex;gap:8px;align-items:center;font-weight:700;margin-bottom:6px}
.perm ul{list-style:none;margin:0;padding:0}.perm li{display:flex;gap:9px;align-items:center;padding:2px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:6px;padding:9px 18px;font:600 14px "Segoe UI",system-ui,sans-serif;cursor:pointer;background:var(--blue);color:#fff;text-decoration:none!important}
.btn:hover{filter:brightness(1.07)}.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.btn.out{background:#fff;color:var(--ink);border-color:var(--line2)}.btn.out:hover{background:#f6f8fb}
.btn.sm{padding:5px 11px;font-size:12.5px}.btn.danger{background:#fff;color:var(--red);border-color:#f0c4c4}
.btn.ms{width:100%;max-width:420px;padding:11px;font-size:15px}
.linkbtn{background:none;border:0;color:var(--blue);cursor:pointer;font:inherit;padding:0}
.opts{max-width:420px;margin:10px auto 0;text-align:left;font-size:13px;color:var(--muted)}
.opts summary{cursor:pointer;text-align:center}
.opts label{display:block;margin-top:8px}
input[type=text],select{font:inherit;border:1px solid var(--line2);border-radius:6px;padding:7px 10px;background:#fff;color:var(--ink);width:100%}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--blue);cursor:pointer;vertical-align:middle;margin:0}
input[type=checkbox]:disabled{cursor:not-allowed}
.learn{text-align:left;background:#fafbfd;border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin-top:14px;font-size:13px}
.learn table td:first-child{width:42%}
.barrow{display:flex;align-items:center;gap:14px;max-width:620px;margin:14px auto 18px}
.bar{flex:1;height:9px;background:#e6eaf0;border-radius:6px;overflow:hidden}.bar span{display:block;height:100%;background:var(--blue);border-radius:6px;transition:width .4s}
.barrow b{font-size:13px;min-width:36px;text-align:right}
.checklist{list-style:none;padding:0;margin:0 auto;max-width:620px;text-align:left}
.checklist li{display:flex;gap:12px;align-items:flex-start;padding:6px 0}
.checklist .ico{flex:none;width:20px;height:20px;margin-top:1px}
.checklist .det{color:var(--faint);font-size:12.5px}
.checklist li.failed .lbl{color:var(--red)}
.spin{width:20px;height:20px;border-radius:50%;border:2.5px solid #cfe0fb;border-top-color:var(--blue);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ring{width:20px;height:20px;border-radius:50%;border:2px solid #b7c0cc}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.tile{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;align-items:center;gap:10px;min-width:0}
.tile b{font-size:20px;display:block;line-height:1.1}.tile small{color:var(--muted);font-size:12px}
.tile.col{flex-direction:column;text-align:center;gap:4px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:8px 0 0}
.tab{padding:8px 12px;border:0;background:none;font:600 13px "Segoe UI",system-ui,sans-serif;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--blue);border-bottom-color:var(--blue);background:#f2f6fe;border-radius:6px 6px 0 0}
.pilltabs{display:flex;gap:6px;margin:10px 0}
.pilltabs .tab{border:1px solid transparent;border-radius:6px;margin:0}
.pilltabs .tab.on{border-color:#a9c4f5;background:#e9f1fe}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--head);text-align:left;font-weight:600;padding:8px 10px;color:#3a4558;white-space:nowrap}
td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:middle}
tr.total td{font-weight:700;background:#fafbfc}
tr.sub td:first-child{padding-left:34px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.cb,th.cb{width:34px;text-align:center}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;background:#eef1f5;color:#5b6677}
.pill.req{background:var(--purplebg);color:var(--purple)}.pill.auto{background:var(--greenbg);color:var(--green)}
.pill.reg{background:var(--bluebg);color:#1a56c8;margin:1px 2px}.pill.warn{background:var(--amberbg);color:var(--amber)}
.pill.bad{background:var(--redbg);color:var(--red)}.pill.ok{background:var(--greenbg);color:var(--green)}
.pill.prim{background:var(--navy);color:#fff;font-size:10.5px;padding:1px 7px;margin-left:6px}
.cat{display:flex;align-items:center;gap:9px}.cat svg{flex:none}
.note{display:flex;gap:9px;align-items:flex-start;background:#edf3fd;border:1px solid #cddcf6;border-radius:8px;padding:9px 12px;margin:10px 0;font-size:13px}
.note.warn{background:var(--amberbg);border-color:#f3d7a6}.note.err{background:var(--redbg);border-color:#f2c2c2;color:#8d1f1f}
.note.ok{background:var(--greenbg);border-color:#bfe5cc}
.foot{display:flex;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.foot .grow{flex:1}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.toolbar input[type=text]{flex:1;min-width:160px}.toolbar label{display:flex;gap:6px;align-items:center}.toolbar select{width:auto}
.pager{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);margin-top:8px}
.muted{color:var(--muted)}.faint{color:var(--faint);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.grid2 label{font-size:12.5px;color:var(--muted);display:block}
.box{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-top:14px}
.box h4{margin:0 0 10px;font-size:13.5px}
.nameinp{padding:4px 7px;font-size:12.5px;min-width:140px}
.arch{display:grid;grid-template-columns:1fr 240px;gap:12px;margin-top:10px}
.diagram{border:1px solid var(--line);border-radius:8px;overflow:auto;background:#fff;padding:8px}
.summary{border:1px solid var(--line);border-radius:8px;padding:12px}
.summary h4{margin:0 0 10px;font-size:13.5px}
.srow{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:12.5px}.srow b{margin-left:auto;font-size:14px}
.srow.tot{border-top:1px solid var(--line);margin-top:4px;padding-top:9px}
.bigok{width:56px;height:56px;margin:4px auto 6px}
.resultpanel{display:grid;grid-template-columns:repeat(3,1fr);background:#eefaf2;border:1px solid #c9ead5;border-radius:8px;margin:12px 0;text-align:center}
.resultpanel div{padding:12px 6px}.resultpanel b{font-size:22px;display:block}.resultpanel small{color:var(--muted)}
.resultpanel.warn{background:#fffaf0;border-color:#f3e0b9}
details.sec{border:1px solid var(--line);border-radius:8px;margin-top:12px;text-align:left}
details.sec>summary{cursor:pointer;padding:10px 14px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"›";font-size:18px;line-height:1;color:var(--faint);transition:transform .15s;display:inline-block}
details.sec[open]>summary::before{transform:rotate(90deg)}
details.sec .body{padding:0 14px 14px}
.secret{display:flex;gap:6px;align-items:center}.secret code{font-size:11.5px;background:#f4f6f9;padding:3px 6px;border-radius:4px;word-break:break-all;flex:1;min-width:0}
.hist{margin-top:22px}
.hist h3{display:flex;align-items:center;gap:10px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal.on{display:flex}
.modal .mc{background:#fff;border-radius:10px;max-width:960px;width:100%;max-height:90vh;overflow:auto;padding:16px}
.err{color:var(--red)}
.chev{display:inline-block;transition:transform .15s;color:var(--faint)}.chev.open{transform:rotate(90deg)}

/* ================= motion ================= */
:root{--ease:cubic-bezier(.2,.8,.2,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes inFwd{from{opacity:0;transform:translateX(32px)}to{opacity:1;transform:none}}
@keyframes inBack{from{opacity:0;transform:translateX(-32px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.3);opacity:0}65%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
@keyframes popIn{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(26,95,216,.45)}100%{box-shadow:0 0 0 10px rgba(26,95,216,0)}}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(31,157,85,.55)}100%{box-shadow:0 0 0 7px rgba(31,157,85,0)}}
@keyframes stripes{from{background-position:0 0}to{background-position:28px 0}}
@keyframes sweep{from{left:-45%}to{left:105%}}
@keyframes shimmer{from{background-position:100% 0}to{background-position:0 0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes scanMove{0%,100%{transform:translate(0,0)}25%{transform:translate(-12px,-7px)}50%{transform:translate(-22px,2px)}75%{transform:translate(-8px,7px)}}
@keyframes ripple{from{transform:scale(1);opacity:.55}to{transform:scale(2.4);opacity:0}}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rowGlow{0%,100%{background-color:#f5f9ff}50%{background-color:#e7f0fe}}
@keyframes flash{from{background-color:#d8e6fd}to{background-color:transparent}}
@keyframes halo{from{transform:scale(.8);opacity:.6}to{transform:scale(1.7);opacity:0}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}

/* step transitions */
#screen.in-fwd{animation:inFwd .42s var(--ease)}
#screen.in-back{animation:inBack .42s var(--ease)}
#screen.in-fwd .tile,#screen.in-back .tile,#screen.in-fwd .resultpanel>div,#screen.in-fwd .summary,#screen.in-fwd .box,
#screen.in-fwd .note,#screen.in-fwd .perm,#screen.in-fwd details.sec{animation:fadeUp .5s var(--ease) both;animation-delay:calc(120ms + var(--i,0) * 70ms)}
#screen.in-fwd .tw tr,#screen.in-back .tw tr{animation:fadeIn .45s ease both;animation-delay:.16s}
#screen.in-fwd .checklist li{animation:fadeUp .4s var(--ease) both;animation-delay:calc(140ms + var(--i,0) * 60ms)}
.banner .num.pop{animation:pop .5s var(--ease)}
.banner #btitle.pop{display:inline-block;animation:fadeUp .4s var(--ease)}

/* stepper */
.st::before{transform-origin:left center}
.st.grow::before{animation:grow .55s var(--ease) both;animation-delay:.05s}
.st.newdone .c{animation:pop .45s var(--ease) both;animation-delay:.35s}
.st.cur .c{animation:pulseRing 1.8s ease-out infinite}
.st .c,.st span{transition:color .3s,border-color .3s,background-color .3s}
.dot.on{animation:pulseDot 1.8s ease-out infinite}

/* buttons */
.btn{position:relative;overflow:hidden;transition:transform .16s var(--ease),box-shadow .22s,background-color .2s,border-color .2s,color .2s}
.btn:not(:disabled):hover{filter:none;transform:translateY(-1px);box-shadow:0 6px 16px -4px rgba(26,95,216,.45)}
.btn.out:not(:disabled):hover,.btn.danger:not(:disabled):hover{box-shadow:0 4px 12px -4px rgba(20,30,50,.18);border-color:#b3c0d2}
.btn.danger:not(:disabled):hover{background:#fff5f5;border-color:#e8a9a9}
.btn:not(:disabled):active{transform:translateY(0) scale(.97);box-shadow:none;transition-duration:.06s}
.btn:not(.out):not(.danger)::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:45%;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.38),transparent);transform:skewX(-15deg);transition:left .7s var(--ease)}
.btn:not(.out):not(.danger):not(:disabled):hover::after{left:120%}
.btn svg{transition:transform .2s var(--ease)}
.btn:not(:disabled):hover svg{transform:translateY(-1px)}
.btn.next:not(:disabled):hover .arr{animation:nudge .7s ease-in-out infinite}
.bspin{width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:rot .75s linear infinite;flex:none}
.btn.out .bspin,.inline-spin{border-color:#cfe0fb;border-top-color:var(--blue)}
.inline-spin{display:inline-block;width:12px;height:12px;border-width:2px;border-style:solid;border-radius:50%;animation:rot .75s linear infinite;vertical-align:-2px;margin-right:6px}
.linkbtn{transition:color .2s}.linkbtn:hover{color:#0b3fa8}
.btn.ms:not(:disabled):hover svg{transform:rotate(-8deg) scale(1.08)}

/* cards, tiles, tables, tabs */
.tile,.summary,.box{transition:transform .22s var(--ease),box-shadow .22s,border-color .22s}
.tile:hover{transform:translateY(-3px);box-shadow:0 10px 22px -10px rgba(20,40,80,.25);border-color:#c5d4ea}
.tile:hover svg{animation:pop .45s var(--ease)}
.card{transition:box-shadow .3s}
td{transition:background-color .18s}
tr:hover>td{background-color:#f7f9fc}
tr.sel>td{background-color:#f4f8ff}
tr.sel>td:first-child{box-shadow:inset 3px 0 0 var(--blue)}
tr.flash>td{animation:flash .9s ease-out}
.tab{transition:color .2s,background-color .25s,border-color .25s,transform .15s}
.tab:not(.on):hover{color:var(--ink);background:#f6f8fb}
.tab:active{transform:scale(.97)}
input[type=checkbox]{transition:transform .15s var(--ease)}
input[type=checkbox]:not(:disabled):hover{transform:scale(1.12)}
input[type=checkbox]:not(:disabled):active{transform:scale(.9)}
input[type=text],select{transition:border-color .2s,box-shadow .2s}
input[type=text]:focus,select:focus{outline:none;border-color:#7aa7f0;box-shadow:0 0 0 3px rgba(26,95,216,.15)}
.pill{transition:background-color .3s,color .3s}
details.sec{transition:box-shadow .25s,border-color .25s}
details.sec:hover{border-color:#cdd7e5}
details.sec>summary{transition:background-color .2s;border-radius:8px}
details.sec>summary:hover{background:#f8fafd}
details.sec[open]>.body{animation:fadeUp .35s var(--ease)}
.opts[open] label{animation:fadeUp .3s var(--ease) both}
.learn{animation:fadeUp .35s var(--ease)}
.modal.on{animation:fadeIn .2s ease}
.modal.on .mc{animation:popIn .32s var(--ease)}

/* progress bars */
.bar{height:10px;box-shadow:inset 0 1px 2px rgba(15,30,60,.08)}
.bar span{position:relative;overflow:hidden;background:linear-gradient(90deg,#1a5fd8,#3b82f6);transition:width .9s var(--ease),background .4s}
.bar.live span::before{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.2) 0 7px,transparent 7px 14px);animation:stripes .9s linear infinite}
.bar.live span::after{content:"";position:absolute;top:0;bottom:0;width:45%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);animation:sweep 1.7s ease-in-out infinite}
.bar.done span{background:linear-gradient(90deg,#1f9d55,#34c172)}
.bar.bad span{background:linear-gradient(90deg,#d93838,#ef6b6b)}
.barrow b{font-variant-numeric:tabular-nums}

/* checklists */
.checklist li{border-radius:7px;padding:6px 10px;transition:background-color .35s}
.checklist li .lbl{transition:color .3s,font-weight .3s}
.checklist li.pending .lbl{color:var(--faint)}
.checklist li.running{animation:rowGlow 2.2s ease-in-out infinite}
.checklist li.running .lbl{color:var(--blue);font-weight:600}
.checklist li.changed .ico{animation:pop .5s var(--ease)}
.checklist li.changed .lbl{animation:fadeIn .4s ease}
.checklist li.failed{background:#fff6f6}

/* animated illustrations */
.anim-float{animation:float 3.4s ease-in-out infinite}
.anim-scan{animation:scanMove 3.4s ease-in-out infinite}
.anim-ripple{transform-box:fill-box;transform-origin:center;animation:ripple 2.2s ease-out infinite}
.anim-ripple.d2{animation-delay:1.1s}
.anim-gear{transform-box:fill-box;transform-origin:center;animation:rot 5s linear infinite}
.anim-gear.rev{animation-direction:reverse;animation-duration:3.5s}
.stopped .anim-gear,.stopped .anim-float,.stopped .anim-scan,.stopped .anim-ripple{animation-play-state:paused}
.stopped .anim-ripple{opacity:0}
.hero{display:inline-block;animation:popIn .55s var(--ease)}
.okwrap{position:relative;width:56px;height:56px;margin:4px auto 6px}
.okwrap .bigok{margin:0;animation:pop .6s var(--ease) both}
.okwrap::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid currentColor;animation:halo 1.1s ease-out .35s both}
.okwrap.ok{color:#1f9d55}.okwrap.warn{color:#e59700}
.okwrap .drawn{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .45s ease-out .45s forwards}
.skel{height:12px;border-radius:6px;background:linear-gradient(90deg,#eef1f5 30%,#dfe5ee 50%,#eef1f5 70%);background-size:300% 100%;animation:shimmer 1.3s ease-in-out infinite}
.skel.w60{width:60%}.skel.w40{width:40%}.skel.w80{width:80%}
.diagram .ln{stroke-dasharray:6 4;animation:flow 1.1s linear infinite}
.diagram .col,.diagram .stg,.diagram .ctr{animation:fadeUp .55s var(--ease) both;animation-delay:calc(80ms + var(--i,0) * 110ms)}
.diagram .stg{animation-delay:calc(200ms + var(--n,1) * 110ms)}
.diagram .ctr{animation-delay:calc(320ms + var(--n,1) * 110ms + var(--i,0) * 80ms)}
.count{font-variant-numeric:tabular-nums}
.azi{flex:none;display:inline-block;vertical-align:middle;object-fit:contain}
.tile .azi{width:30px;height:30px}
.credit{text-align:center;color:var(--faint);font-size:11px;margin-top:14px}

@media (prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
 .okwrap .drawn{stroke-dashoffset:0}
}
@media (max-width:980px){.arch{grid-template-columns:1fr}.inner{padding:18px 22px 24px}}
@media (max-width:640px){
 .banner{font-size:16px}.tiles{grid-template-columns:repeat(2,1fr)}.arch{grid-template-columns:1fr}

async function api(path, data) {
  const opt = data ? {method: "POST", headers: {"Content-Type": "application/x-www-form-urlencoded"},
    body: new URLSearchParams(data)} : {};
  const r = await fetch(path, opt);
  let body = null; try { body = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error((body && body.error) || `HTTP ${r.status}`);
  return body;
}

// ---------- frame ----------
function restart(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function frame(n, moved = false) {
  $("#bnum").textContent = n; $("#btitle").textContent = SCREENS[n];
  if (moved) { restart($("#bnum"), "pop"); restart($("#btitle"), "pop"); }
  document.title = `${SCREENS[n]} · Onboard Azure`;
  const cur = STEP_OF[n], last = S.lastStep ?? cur;
  if (moved || S.lastStep == null || !$("#stepper").children.length) {
    $("#stepper").innerHTML = STEPS.map((s, i) => {
      const cls = i < cur ? "done" : i === cur ? "cur" : "";
      const anim = moved && cur > last ? (i > last && i <= cur ? " grow" : "") + (i >= last && i < cur ? " newdone" : "") : "";
      return `<div class="st ${cls}${anim}"><div class="c">${cls === "done" ? I.check("#fff") : ""}</div><span>${s}</span></div>`;
    }).join("");
  }
  S.lastStep = cur;
  const r = S.rec;
  let sess = "";
  if (r && n > 1) sess = r.live ? `<span class="dot on"></span>${esc(r.signedInAs || "Signed in")} · ${r.minutesLeft} min left`
                       : (r.signInDiscardedAt ? `<span class="dot"></span>Admin sign-in discarded` : "");
  $("#sess").innerHTML = sess;
}

function show(n, animate = true) {
  const prev = S.screen; S.screen = n;
  if (S.id && n >= 3 && n <= 6) store.set("screen-" + S.id, n);
  frame(n, animate && prev !== n);
  const html = {1: scrSignin, 2: scrScan, 3: scrDiscovery, 4: scrSelect, 5: scrPlan, 6: scrArch, 7: scrDeploy, 8: scrResults}[n]();
  const el = $("#screen");
  el.classList.remove("in-fwd", "in-back");
  el.innerHTML = html;
  if (animate) { void el.offsetWidth; el.classList.add(n >= prev ? "in-fwd" : "in-back"); countUps(el); }
  if (animate || n !== 1) $("#below").innerHTML = n === 1 ? `<div class="hist" id="hist"></div>` : "";
  if (n === 1 && animate) loadHistory();
  if (n === 5 && !S.plan && !S.planBusy) requestPlan(0);
  if (S.flash) { const f = el.querySelector(S.flash); if (f) f.classList.add("flash"); S.flash = null; }
  if (animate) window.scrollTo({top: 0, behavior: window.scrollY > 120 ? "smooth" : "auto"});
}
function rerender() {  // same screen, keep scroll, no entrance animation
  const y = window.scrollY; show(S.screen, false); window.scrollTo({top: y});
}
// numbers count up when a screen opens
function countUps(root) {
  root.querySelectorAll("[data-count]").forEach(el => {
    const to = +el.dataset.count; if (!to) return;
    const t0 = performance.now() + 150, dur = 900;
    el.textContent = "0";
    const tick = now => { const k = Math.min(1, Math.max(0, (now - t0) / dur)), e = 1 - Math.pow(1 - k, 3);
      el.textContent = fmt(Math.round(to * e)); if (k < 1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  });
}
function tweenNum(el, from, to, suffix = "") {
  if (!el || from === to) { if (el) el.textContent = fmt(to) + suffix; return; }
  const t0 = performance.now(), dur = 600;
  const tick = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = fmt(Math.round(from + (to - from) * e)) + suffix; if (k < 1) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}
// progress screens update in place: the bar glides, only changed steps re-draw
function stepItem(s, i, inlineDetail, changed) {
  let label = esc(s.label);
  if (inlineDetail && s.detail) label += ` (${esc(s.detail)})`;
  const det = !inlineDetail && s.detail ? `<div class="det">${esc(s.detail)}</div>` : "";
  return `<li class="${s.state}${changed ? " changed" : ""}" style="--i:${i}" data-key="${s.key}" data-state="${s.state}" data-sig="${esc(s.state + "|" + s.detail)}">
    ${stepIcon(s.state)}<div><div class="lbl">${label}</div>${det}</div></li>`;
}
function barHtml(pct, state) {
  return `<div class="barrow"><div class="bar ${state}"><span style="width:${pct}%"></span></div><b id="pct" data-v="${pct}">${pct}%</b></div>`;
}
function patchProgress(prog, inlineKey) {
  const bar = $("#screen .bar"), pctEl = $("#pct");
  if (!bar || !pctEl || !prog) return false;
  bar.querySelector("span").style.width = prog.pct + "%";
  bar.className = "bar " + (prog.pct >= 100 ? "done" : "live");
  tweenNum(pctEl, +pctEl.dataset.v || 0, prog.pct, "%"); pctEl.dataset.v = prog.pct;
  for (const [i, s] of prog.steps.entries()) {
    const li = $(`#screen li[data-key="${s.key}"]`);
    if (!li) return false;
    if (li.dataset.sig !== s.state + "|" + s.detail) {
      const changed = li.dataset.state !== s.state;
      li.outerHTML = stepItem(s, i, s.key === inlineKey, changed);
    }
  }
  return true;
}

function setRes(i, on) {

function toggleRes(i, on) { setRes(i, on); S.flash = `tr[data-i="${i}"]`; saveSel(); rerender(); }

// ---------- 5. plan ----------
function requestPlan(delay = 400) {

    S.planBusy = true; S.planErr = ""; if (S.screen === 5) rerender();
    try {
      S.plan = await api("/az/api/plan", {id: S.id, data: JSON.stringify({selection: selPayload(), target: S.target, names: S.names})});

  }, delay);
}

function setName(k, v) { v = v.trim(); if (v) S.names[k] = v; else delete S.names[k]; saveSel(); requestPlan(0); }

// ---------- 6. architecture ----------
function archSvg(regions, storage, totalLabel) {
  const n = regions.length, cw = 214, gap = 18, pad = 12, W = Math.max(n * cw + (n - 1) * gap + 2 * pad, 300);
  const colH = 150, top = 6, busY = top + colH + 22, stY = busY + 22, stH = 46, ctY = stY + stH + 34, H = ctY + 40;
  const x0 = i => pad + i * (cw + gap);
  const t = (x, y, s, o = "") => `<text x="${x}" y="${y}" ${o}>${esc(s)}</text>`;
  const trunc = (s, m) => s.length > m ? s.slice(0, m - 1) + "…" : s;
  let g = "";
  regions.forEach((r, i) => {
    const x = x0(i), cx = x + cw / 2;
    g += `<g class="col" style="--i:${i}"><rect x="${x}" y="${top}" width="${cw}" height="${colH}" rx="8" fill="#fbfcfe" stroke="#d4dbe5"/>`;
    g += t(cx, top + 20, r.display, `text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d2433"`);
    g += t(cx, top + 35, `${fmt(r.count + (r.global || 0))} resources${r.primary ? " · primary" : ""}`, `text-anchor="middle" font-size="10.5" fill="#5f6b7c"`);
    g += `<rect x="${x + 10}" y="${top + 46}" width="${cw - 20}" height="40" rx="5" fill="#fff" stroke="#9cc3f2"/>`;
    g += `<image href="${azHref("event-hubs")}" x="${x + 16}" y="${top + 55}" width="20" height="20"/>`;
    g += t(x + 42, top + 63, trunc(r.namespace, 25), `font-size="11" font-weight="600" fill="#1d2433"`);
    g += t(x + 42, top + 77, "(Event Hub Namespace)", `font-size="9.5" fill="#5f6b7c"`);
    g += `<rect x="${x + 10}" y="${top + 94}" width="${cw - 20}" height="40" rx="5" fill="#fff" stroke="#9dd3b0" stroke-dasharray="4 3"/>`;
    g += `<image href="${azHref("event-hubs")}" x="${x + 18}" y="${top + 105}" width="16" height="16"/>`;
    g += t(x + 42, top + 111, trunc(r.eventHub, 25), `font-size="11" font-weight="600" fill="#1d2433"`);
    g += t(x + 42, top + 125, "(Event Hub)", `font-size="9.5" fill="#5f6b7c"`) + `</g>`;
    g += `<path class="ln" d="M${cx} ${top + colH} V${busY}" stroke="#1a5fd8" stroke-width="1.6"/>`;
    // container
    const cwid = cw - 12;
    g += `<path class="ln" d="M${W / 2} ${stY + stH} V${ctY - 14} H${cx} V${ctY}" fill="none" stroke="#2e9e5b" stroke-width="1.4" marker-end="url(#ag)"/>`;
    g += `<g class="ctr" style="--i:${i};--n:${n}"><rect x="${cx - cwid / 2}" y="${ctY}" width="${cwid}" height="30" rx="5" fill="#fffaf0" stroke="#f3d08a"/>`;
    g += `<image href="${azHref("storage-container")}" x="${cx - cwid / 2 + 7}" y="${ctY + 6}" width="18" height="18"/>`;
    g += t(cx - cwid / 2 + 30, ctY + 19, trunc(r.container, 28), `font-size="10.5" fill="#1d2433"`) + `</g>`;
  });
  const sw = 250, sx = W / 2 - sw / 2;
  g += `<path class="ln" d="M${x0(0) + cw / 2} ${busY} H${x0(n - 1) + cw / 2}" stroke="#1a5fd8" stroke-width="1.6"/>`;
  g += `<path class="ln" d="M${W / 2} ${busY} V${stY - 2}" stroke="#1a5fd8" stroke-width="1.6" marker-end="url(#ab)"/>`;
  g += `<g class="stg" style="--n:${n}"><rect x="${sx}" y="${stY}" width="${sw}" height="${stH}" rx="7" fill="#eefaf2" stroke="#8fd1a7"/>`;
  g += `<image href="${azHref("storage-accounts")}" x="${sx + 12}" y="${stY + 12}" width="22" height="22"/>`;
  g += t(sx + 42, stY + 21, storage.name, `font-size="12.5" font-weight="700" fill="#1d2433"`);
  g += t(sx + 42, stY + 36, `(Storage Account - Checkpoint) · ${storage.display || ""}`, `font-size="9.5" fill="#5f6b7c"`) + `</g>`;
  const defs = `<defs><marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4 0 8z" fill="#1a5fd8"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4 0 8z" fill="#2e9e5b"/></marker></defs>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="Segoe UI, Arial, sans-serif" style="display:block;margin:0 auto;width:100%;height:auto;max-width:${W}px;min-width:${Math.min(W, n * 140)}px">${defs}<rect width="${W}" height="${H}" fill="#fff"/>${g}</svg>`;
}
function summaryBox(n, total, title = "Deployment Summary") {
  const row = (ico, l, v, cls = "") => `<div class="srow ${cls}">${ico}<span>${l}</span><b>${v}</b></div>`;
  return `<div class="summary" style="--i:1"><h4>${title}</h4>${row(azImg("event-hubs", 22), "Event Hub Namespaces", n)}${row(azImg("event-hubs", 22), "Event Hubs", n)}
    ${row(azImg("storage-accounts", 22), "Storage Account", 1)}${row(azImg("storage-container", 22), "Containers", n)}${row(azImg("all-resources", 22), "Total Resources", fmt(total), "tot")}</div>`;
}
function scrArch() {
  const p = S.plan;

  return `<h2>Review Deployment Architecture</h2>
   <p class="sub">Here is the proposed architecture based on your selected resources.</p>

async function confirmDeploy() {

// ---------- 7. deploying ----------
function scrDeploy() {
  const r = S.rec, dep = r.deploy || {pct: 0, steps: []};

  const items = dep.steps.map((s, i) => stepItem(s, i, false, false)).join("");
  return `<div class="center"><div class="hero ${failed ? "stopped" : ""}">${I.cloudgear}</div>

    <p class="sub">Provisioning Event Hubs, Storage Account, and configuring log collection...</p>

    <ul class="checklist">${items}</ul>
    ${failed ? `<div class="note err" style="text-align:left;margin-top:16px">${esc(r.error)}</div>
      <div class="foot" style="justify-content:center">${r.live && S.disc ? `<button class="btn out" onclick="show(5)">‹ Back to the plan</button>` : ""}
      <a class="btn" href="/">Start again</a></div>`
      : `<p class="faint" style="margin-top:14px">You can leave this page: the Hub keeps going and this page catches up when you come back.</p>
         <div class="foot" style="justify-content:center"><button class="linkbtn" onclick="cancelRun()">Cancel</button></div>`}
  </div>`;
}

// ---------- 8. results ----------
function scrResults() {
  const r = S.rec, res = r.results || {}, c = r.credentials || {regions: [], storage: {}}, n = c.regions.length, tests = r.tests || {};
  const warn = res.failedSkipped > 0 || tests.ok === false;
  let ti = 0;
  const tile = (ico, v, l) => `<div class="tile col" style="--i:${ti++}">${ico}<b class="count" data-count="${v || 0}">${fmt(v)}</b><small>${l}</small></div>`;
  const byCat = Object.entries(res.byCategory || {}).map(([k, v]) => {
    const cat = (S.disc && S.disc.cats.find(x => x.key === k)) || {label: k === "other" ? "Other Resources" : k};
    return `<tr><td>${esc(cat.label)}</td><td class="num">${fmt(v.onboarded || 0)}</td><td class="num">${fmt(v.already || 0)}</td>
      <td class="num">${fmt(v.skipped || 0)}</td><td class="num">${fmt(v.failed || 0)}</td></tr>`;
  }).join("");

    <td><span class="pill ${x.status === "failed" ? "bad" : x.status === "skipped" ? "warn" : "ok"}">${esc(x.status)}</span></td><td>${esc(x.reason)}</td></tr>`).join("");

  return `<div class="center">${warn ? I.bigwarn : I.bigok}

    <div class="tiles">${tile(azImg("event-hubs", 30), n, "Event Hub<br>Namespaces")}${tile(azImg("event-hubs", 30), n, "Event Hubs")}${tile(azImg("storage-accounts", 30), 1, "Storage<br>Account")}${tile(azImg("storage-container", 30), n, "Containers")}</div>

      [I.tri, (res.failedSkipped || 0) - countTenant(res, ["failed", "skipped"]), "Failed / Skipped", "color:var(--red)"]]
      .map(([ico, v, l, st], k) => `<div style="--i:${k + 4}">${ico}<b class="count" style="${st}" data-count="${v || 0}">${fmt(v)}</b><small>${l}</small></div>`).join("")}</div>
    <div class="foot" style="justify-content:center"><button class="btn out" onclick="viewArch()">${I.arch} View Architecture</button>
      <button class="btn out" onclick="downloadSummary()">${I.dl} Download Summary</button><a class="btn" href="/" style="min-width:140px">Finish</a></div>
  </div>
  <details class="sec" open style="--i:7"><summary>Connection details for the connector</summary><div class="body">
    <div class="tw"><table><tr><th>Region</th><th>Namespace / Event hub</th><th>Consumer group</th><th>Checkpoint container</th></tr>
    ${c.regions.map(x => `<tr><td>${esc(x.display)}</td><td><b>${esc(x.namespace)}</b> / ${esc(x.eventHub)}</td><td>${esc(x.consumerGroup)}</td><td>${esc(x.container)}</td></tr>
      <tr><td colspan="4">${secret(x.connectionString, `Event Hub connection string · ${x.display} (policy ${x.policy})`)}</td></tr>`).join("")}</table></div>
    <div class="box"><h4>Storage account ${esc(c.storage.name)} · ${esc(c.storage.display)}</h4>
      ${secret(c.storage.connectionString, "Storage connection string (key 1)")}
      <p class="faint" style="margin-bottom:0">Event Hubs policy keys never expire. Storage: ${expText}.</p></div>
    <div class="foot"><button class="btn sm" id="testbtn" onclick="runTest()">Test connection</button>
      <span class="${tests.ok ? "" : "err"}" style="font-weight:600">${tests.at ? (tests.ok ? "✓ Working" : "✗ Not working") + ` <span class="faint">(${esc(tests.at)})</span>` : ""}</span></div>
    ${(tests.results || []).map(t => `<div class="faint">${t.ok ? "✓" : "✗"} ${esc(t.name)}: ${esc(t.detail)}</div>`).join("")}
  </div></details>
  <details class="sec"><summary>Log forwarding</summary><div class="body">
    <p><b>Microsoft Entra ID:</b> ${entra.status === "on" ? `streaming ${entra.categories.length} categories` : entra.status === "partial" ? `streaming ${entra.categories.length} core categories` : "not streamed"}

    <p><b>Activity log:</b> ${(res.activity || []).map(a => `${esc(a.subscription)} <span class="pill ${a.status === "onboarded" || a.status === "already" ? "ok" : a.status === "failed" ? "bad" : "warn"}">${esc(a.status)}</span>`).join(" ")}</p>
    <div class="tw"><table><tr><th>Category</th><th class="num">Onboarded</th><th class="num">Already streaming</th><th class="num">Skipped</th><th class="num">Failed</th></tr>${byCat}</table></div>

  </div></details>
  <details class="sec" ${issues.length ? "" : ""}><summary>Failed &amp; skipped (${fmt(issues.length)})${already.length ? ` · already streaming (${fmt(already.length)})` : ""}</summary><div class="body">
    ${issues.length ? `<div class="tw"><table><tr><th>Name</th><th>Type</th><th>Region</th><th>Status</th><th>Reason</th></tr>${issueRows(issues)}</table></div>` : `<p class="muted">Nothing failed or was skipped.</p>`}
    ${already.length ? `<h3>Already streaming to this hub (not duplicated)</h3><div class="tw"><table><tr><th>Name</th><th>Type</th><th>Region</th><th>Status</th><th>Reason</th></tr>${issueRows(already)}</table></div>` : ""}
  </div></details>
  <details class="sec"><summary>Onboarding timeline</summary><div class="body">
    ${(r.log || []).map(l => `<div class="faint"><span style="font-variant-numeric:tabular-nums">${esc(l[2])}</span> · ${esc(l[1])}</div>`).join("")}
  </div></details>`;
}
function countTenant(res, statuses) {  // the green panel counts resources: leave Entra ID and the Activity logs out
  const bc = res.byCategory || {};

}
let secretSeq = 0;
function secret(v, label) {

  return `<div class="faint">${esc(label)}</div><div class="secret"><code id="${id}" data-v="${esc(v)}">${v ? "•".repeat(28) + esc(v.slice(-4)) : "—"}</code>
    <button class="btn sm out" onclick="reveal('${id}',this)">Show</button><button class="btn sm out" onclick="copySecret('${id}',this)">Copy</button></div>`;
}
function reveal(id, b) { const e = $("#" + id), v = e.dataset.v; const on = b.textContent === "Show";
  e.textContent = on ? v : "•".repeat(28) + v.slice(-4); b.textContent = on ? "Hide" : "Show"; }
function copySecret(id, b) { navigator.clipboard.writeText($("#" + id).dataset.v).then(() => { b.textContent = "Copied"; setTimeout(() => b.textContent = "Copy", 1500); }); }
async function runTest() {
  const b = $("#testbtn"); b.disabled = true; b.innerHTML = `<span class="bspin"></span> Testing…`;
  try { await api("/az/api/test", {id: S.id}); } catch (e) { alert(e.message); }
  await refresh(); }
function deployedRegions() {
  const p = S.rec.plan || {regions: []};
  return p.regions;
}
function viewArch() {
  const p = S.rec.plan;
  const svg = archSvg(p.regions, {...p.storage, display: (S.rec.credentials || {}).storage?.display || p.storage.display});
  $("#modalc").innerHTML = `<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><h3 style="margin:0">Deployed architecture</h3>
    <span class="grow" style="flex:1"></span><button class="btn sm out" id="mdl">${I.dl} Download</button><button class="btn sm" onclick="closeModal()">Close</button></div>
    <div class="arch"><div class="diagram">${svg}</div>${summaryBox(p.regions.length, (S.rec.results || {}).selected || 0, "Deployed")}</div>`;
  $("#mdl").onclick = () => downloadSvg(svg);
  $("#modal").classList.add("on");
}
function closeModal() { $("#modal").classList.remove("on"); }
function downloadSummary() {
  const r = S.rec, c = r.credentials || {regions: [], storage: {}};
  const summary = {onboarding: r.id, signedInAs: r.signedInAs, tenant: r.tenant, startedAt: r.createdAt, finishedAt: r.finishedAt,
    target: (r.plan || {}).target, primaryRegion: (r.plan || {}).primary,
    regions: c.regions.map(x => ({region: x.region, namespace: x.namespace, eventHub: x.eventHub, consumerGroup: x.consumerGroup,
      checkpointContainer: x.container, sharedAccessPolicy: x.policy})),
    storageAccount: {name: c.storage.name, region: c.storage.location, keyExpiry: c.storage.expiry},
    results: {...(r.results || {}), issues: undefined}, failedAndSkipped: ((r.results || {}).issues || []).filter(x => x.status !== "already"),
    connectionTest: r.tests, note: "Connection strings are not included in this file."};
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(summary, null, 2)], {type: "application/json"}));
  a.download = `cor-azure-onboarding-${r.id}.json`; a.click();
}

// ---------- routing / polling ----------
function screenFor(r) {
  if (!r) return 1;
  if (r.phase === "signin") return 1;
  if (r.phase === "scanning") return 2;
  if (r.phase === "select") return S.disc ? (store.get("screen-" + S.id) || 3) : 1;
  if (r.phase === "deploying") return 7;
  if (r.phase === "done") return 8;
  if (r.phase === "failed" || r.phase === "cancelled") return r.failedAt === "deploy" || r.deploy ? 7 : r.scan ? 2 : 1;
  return 1;
}
async function refresh() {
  if (!S.id) { show(1); return; }
  try { S.rec = await api("/az/api/state?id=" + encodeURIComponent(S.id)); }
  catch (e) { S.id = null; history.replaceState(null, "", "/"); show(1); return; }
  if (S.rec.hasDiscovery && !S.disc && ["select", "deploying", "done", "failed"].includes(S.rec.phase)) {
    try { S.disc = await api("/az/api/discovery?id=" + S.id); initSel(); } catch (e) {}
  }
  if (S.rec.phase === "select" && (!S.disc || !S.rec.live)) {  // Hub restarted or sign-in expired: the scan is unusable
    S.rec.phase = "failed";
    S.rec.error = S.disc ? "The Azure sign-in expired before the deployment was confirmed: sign in again."
                         : "The Hub restarted and the scan is no longer in memory: sign in again to rescan.";
  }
  const want = screenFor(S.rec);
  const keepClient = S.rec.phase === "select" && S.screen >= 3 && S.screen <= 6;
  if (keepClient) frame(S.screen);
  else if (want === S.screen && want === 2 && S.rec.phase === "scanning" && patchProgress(S.rec.scan, "resources")) frame(2);
  else if (want === S.screen && want === 7 && S.rec.phase === "deploying" && patchProgress(S.rec.deploy, "")) frame(7);
  else if (want === S.screen) rerender();
  else show(want);
  clearTimeout(S.timer);
  const busy = ["scanning", "deploying"].includes(S.rec.phase);
  if (busy || S.rec.phase === "select") S.timer = setTimeout(refresh, busy ? 1500 : 30000);
}
document.getElementById("hlogo").innerHTML = I.azure(20);
if (S.id) refresh(); else show(1);
</script>
